

<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOST - 교내 분실물 센터</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f4f5f8;color:#202331;font-family:Arial,sans-serif}

header{background:#202331;color:white;padding:30px 22px}

header h1{font-size:32px;letter-spacing:3px;margin:0}

header p{color:#b9bdca;font-size:13px}

main{max-width:850px;margin:25px auto;padding:0 16px}

.panel{background:white;border-radius:16px;padding:20px;margin-bottom:18px}

h2{font-size:18px;margin-top:0}

input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px;font-size:14px;background:white}

textarea{resize:vertical}

button{border:0;border-radius:9px;padding:12px 17px;background:#252b40;color:white;font-weight:bold;cursor:pointer}

button:hover{opacity:.85}

.tabs{display:flex;gap:8px;margin-bottom:15px}

.tabs button{flex:1;background:#e9eaf0;color:#333}

.tabs button.active{background:#252b40;color:white}

.search{margin-bottom:12px}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}

.item{background:white;border-radius:13px;overflow:hidden;border:1px solid #eee}

.item img{width:100%;height:150px;object-fit:cover;background:#eee}

.item-content{padding:14px}

.item h3{margin:0 0 8px}

.item p{font-size:13px;color:#777;margin:6px 0}

.tag{font-size:11px;background:#edf0f8;padding:5px 8px;border-radius:20px}

.done{background:#e7f6eb;color:#26743b}

.item button{margin-top:10px;width:100%;font-size:12px}

.empty{text-align:center;color:#999;padding:35px}

footer{text-align:center;color:#aaa;font-size:12px;padding:25px}

</style>

</head>

<body>

<header>

<h1>LOST.</h1>

<p>FIND WHAT YOU LOST. RETURN WHAT YOU FOUND.</p>

</header>

<main>

<section class="panel">

<h2>＋ 물건 등록하기</h2>

<form id="form">

<input id="name" placeholder="물건 이름 (예: 검은색 에어팟)" required>

<select id="type">

<option value="분실">분실했어요</option>

<option value="습득">주웠어요</option>

</select>

<input id="place" placeholder="발견 / 분실 장소" required>

<input id="date" type="date" required>

<textarea id="desc" placeholder="물건의 특징이나 추가 설명"></textarea>

<label style="font-size:13px">물건 사진</label>

<input id="photo" type="file" accept="image/*">

<button type="submit" style="width:100%">등록하기</button>

</form>

</section>

<section class="panel">

<h2>분실물 목록</h2>

<input class="search" id="search" placeholder="🔍 물건 이름이나 장소 검색">

<div class="tabs">

<button class="active" data-filter="전체">전체</button>

<button data-filter="분실">분실</button>

<button data-filter="습득">습득</button>

<button data-filter="완료">완료</button>

</div>

<div id="items" class="items"></div>

</section>

</main>

<footer>LOST. · SCHOOL LOST AND FOUND</footer>

<script>

const KEY="lost_items_v1";

let items=JSON.parse(localStorage.getItem(KEY)||"[]");

let filter="전체";

const $=id=>document.getElementById(id);

const save=()=>localStorage.setItem(KEY,JSON.stringify(items));

function escapeHTML(s){

 return String(s).replace(/[&<>"']/g,c=>({

 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

 })[c]);

}

function render(){

 const q=$("search").value.toLowerCase();

 const filtered=items.filter(x=>{

  const matchesFilter=filter==="전체"||

   (filter==="완료"?x.done:x.type===filter&&!x.done);

  return matchesFilter&&(x.name+" "+x.place+" "+x.desc).toLowerCase().includes(q);

 });

 $("items").innerHTML=filtered.length?"":"<div class='empty'>등록된 물건이 없습니다.</div>";

 filtered.forEach(x=>{

  const card=document.createElement("article");

  card.className="item";

  const img=document.createElement("img");

  img.src=x.photo||"";

  img.alt=x.name;

  if(!x.photo)img.style.display="none";

  card.appendChild(img);

  const content=document.createElement("div");

  content.className="item-content";

  content.innerHTML=`

   <span class="tag ${x.done?"done":""}">${x.done?"찾음":escapeHTML(x.type)}</span>

   <h3>${escapeHTML(x.name)}</h3>

   <p>📍 ${escapeHTML(x.place)}</p>

   <p>📅 ${escapeHTML(x.date)}</p>

   <p>${escapeHTML(x.desc)}</p>

   <button class="finish">${x.done?"완료 취소":"찾았어요!"}</button>

   <button class="delete" style="background:#e9eaf0;color:#444">삭제</button>

  `;

  content.querySelector(".finish").onclick=()=>{

   x.done=!x.done;save();render();

  };

  content.querySelector(".delete").onclick=()=>{

   if(confirm("이 게시물을 삭제할까요?")){

    items=items.filter(a=>a.id!==x.id);save();render();

   }

  };

  card.appendChild(content);

  $("items").appendChild(card);

 });

}

$("form").addEventListener("submit",async e=>{

 e.preventDefault();

 const file=$("photo").files[0];

 let photo="";

 if(file){

  if(!file.type.startsWith("image/"))return alert("이미지 파일만 가능합니다.");

  if(file.size>1500000)return alert("사진은 1.5MB 이하로 선택해 주세요.");

  photo=await new Promise((resolve,reject)=>{

   const reader=new FileReader();

   reader.onload=()=>resolve(reader.result);

   reader.onerror=reject;

   reader.readAsDataURL(file);

  });

 }

 items.unshift({

  id:Date.now(),

  name:$("name").value.trim(),

  type:$("type").value,

  place:$("place").value.trim(),

  date:$("date").value,

  desc:$("desc").value.trim(),

  photo,

  done:false

 });

 try{save()}catch(err){

  items.shift();

  return alert("저장 공간이 부족합니다. 사진 크기를 줄여 주세요.");

 }

 e.target.reset();

 render();

 alert("등록되었습니다!");

});

$("search").addEventListener("input",render);

document.querySelectorAll(".tabs button").forEach(btn=>{

 btn.onclick=()=>{

  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  filter=btn.dataset.filter;

  render();

 };

});

render();

</script>

</body>

</html>
